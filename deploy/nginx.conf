user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    upstream approval_api_backend {
        server approval-api:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # 客户端请求体限制 (支持大快照与附件)
        client_max_body_size 50M;

        # 安全防线：强制剥离外部伪造的审批特权头，防止请求欺骗
        proxy_set_header X-Approval-User "";
        proxy_set_header X-Approval-User-Name "";
        proxy_set_header X-Approval-Gateway-Secret "";

        # 传递标准网络代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 健康检查代理路由
        location /health {
            proxy_pass http://approval_api_backend/health;
            access_log off;
        }

        # 主应用与 API 代理路由
        location / {
            proxy_pass http://approval_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
